<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaction Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07120f;
  --panel:#0b1a16;
  --panel-2:#0e221c;
  --ink:#f4f1e8;
  --ink-dim:#a9b5ae;
  --gold:#f5b942;
  --gold-soft:#ffd784;
  --green:#5ddc8c;
  --red:#ff6b6b;
  --blue:#7fb2ff;
  --line:rgba(245,185,66,.55);
  --line-soft:rgba(245,185,66,.18);
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1100px 600px at 82% 12%, rgba(245,185,66,.10), transparent 62%),
    radial-gradient(800px 500px at 10% 88%, rgba(120,200,160,.07), transparent 60%);
}

/* ---------- shell ---------- */
#app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}
header{
  flex:0 0 auto;display:flex;align-items:center;gap:18px;
  padding:14px 26px;border-bottom:1px solid var(--line-soft);
}
.brand{font-family:'Caveat',cursive;font-size:34px;line-height:1;color:var(--gold);
  text-shadow:0 0 14px rgba(245,185,66,.45);white-space:nowrap}
.brand small{display:block;font-size:17px;opacity:.75;margin-top:-2px}
.title-wrap{flex:1 1 auto;min-width:0}
.slide-title{font-size:24px;font-weight:600;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide-sub{font-size:15px;color:var(--ink-dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.badge{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--gold-soft);
  background:rgba(245,185,66,.08);white-space:nowrap}
.badge.pg{border-color:rgba(127,178,255,.5);color:var(--blue);background:rgba(127,178,255,.08)}
.clock{font-family:var(--mono);font-size:14px;color:var(--ink-dim);min-width:58px;text-align:right}

/* ---------- stage ---------- */
main{flex:1 1 auto;min-height:0;padding:20px 26px;display:flex;flex-direction:column;gap:14px}
.slide{display:none;flex:1 1 auto;min-height:0;flex-direction:column;gap:14px}
.slide.active{display:flex}

/* ---------- title slide ---------- */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:16px}
.hero h1{font-size:clamp(34px,5.2vw,68px);margin:0;line-height:1.05;font-weight:700}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;max-width:820px;font-size:clamp(14px,1.5vw,19px);color:var(--ink-dim);line-height:1.6}
.hero .cup{font-size:clamp(46px,7vw,84px);filter:drop-shadow(0 6px 24px rgba(245,185,66,.35))}
.hero-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.hero-chips span{border:1px solid var(--line-soft);border-radius:999px;padding:8px 15px;
  font-size:16px;color:var(--gold-soft);background:rgba(245,185,66,.06)}
.kbd-hint{margin-top:18px;font-size:15px;color:var(--ink-dim)}
kbd{font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--ink)}

/* ---------- generic card ---------- */
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border:1px solid var(--line-soft);border-radius:16px}

/* ---------- session panes ---------- */
.panes{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panes.solo{grid-template-columns:1fr}
.pane{display:flex;flex-direction:column;min-height:0;border-radius:16px;overflow:hidden;
  border:1px solid var(--line-soft);background:rgba(4,10,9,.78);transition:border-color .25s,box-shadow .25s}
.pane.live{border-color:var(--line);box-shadow:0 0 0 1px rgba(245,185,66,.18),0 12px 40px rgba(0,0,0,.45)}
.pane-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line-soft);background:rgba(255,255,255,.035)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(245,185,66,.55)}
.pane.live .dot{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,185,66,.5)}70%{box-shadow:0 0 0 9px rgba(245,185,66,0)}100%{box-shadow:0 0 0 0 rgba(245,185,66,0)}}
.pane-name{font-weight:600;font-size:17px}
.pane-role{font-size:14.5px;color:var(--ink-dim);flex:1 1 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-iso{font-family:var(--mono);font-size:12.5px;color:var(--gold-soft);
  border:1px solid var(--line-soft);border-radius:6px;padding:3px 7px;white-space:nowrap}
.pane-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 14px;
  font-family:var(--mono);font-size:17px;line-height:1.6}
.pane-body::-webkit-scrollbar{width:8px}
.pane-body::-webkit-scrollbar-thumb{background:rgba(245,185,66,.25);border-radius:4px}

.line{margin-bottom:9px}
.line.fresh{opacity:0;transform:translateY(6px);animation:in .26s ease forwards}
@keyframes in{to{opacity:1;transform:none}}
.line .tm{color:rgba(245,185,66,.55);font-size:13px;margin-right:9px}
.sql{color:var(--gold-soft);white-space:pre-wrap;word-break:break-word}
.sql .kw{color:var(--gold);font-weight:700}
.out{margin-top:4px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.045);
  border-left:2px solid rgba(255,255,255,.18);color:var(--ink);white-space:pre;overflow-x:auto;font-size:16px}
.out.ok{border-left-color:var(--green);color:#cdf3dc}
.out.err{border-left-color:var(--red);color:#ffc9c9;background:rgba(255,107,107,.09);white-space:pre-wrap}
.out.wait{border-left-color:var(--blue);color:#cfe1ff;background:rgba(127,178,255,.08)}
.out.muted{color:var(--ink-dim)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--gold);
  vertical-align:-2px;animation:blink 1.05s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- state strip ---------- */
.state{flex:0 0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.chip{flex:1 1 175px;min-width:165px;padding:11px 15px;border-radius:12px;
  border:1px solid var(--line-soft);background:rgba(255,255,255,.035);
  transition:border-color .3s,background .3s,transform .3s}
.chip.flash{border-color:var(--gold);background:rgba(245,185,66,.14);transform:translateY(-2px)}
.chip .k{font-size:12.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-dim)}
.chip .v{font-family:var(--mono);font-size:26px;font-weight:700;margin-top:3px;color:var(--ink)}
.chip.dirty .v{color:var(--gold)}
.chip.dirty{border-style:dashed;border-color:var(--gold)}
.chip .n{font-size:13px;color:var(--ink-dim);margin-top:2px}
.chip.good .v{color:var(--green)}
.chip.bad .v{color:var(--red)}

/* ---------- insight ---------- */
.insight{flex:0 0 auto;display:flex;gap:12px;align-items:flex-start;padding:12px 16px;
  border-radius:14px;border:1px solid var(--line);background:rgba(245,185,66,.07);
  min-height:72px;transition:opacity .25s}
.insight .ic{font-size:24px;line-height:1.2;flex:0 0 auto}
.insight .tx{font-size:18px;line-height:1.5}
.insight .tx b{color:var(--gold-soft)}
.insight.warn{border-color:rgba(255,107,107,.6);background:rgba(255,107,107,.08)}
.insight.win{border-color:rgba(93,220,140,.55);background:rgba(93,220,140,.07)}

/* ---------- schema slide ---------- */
.schema{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-content:start}
.tbl{padding:14px 16px;border-radius:14px;border:1px solid var(--line-soft);
  background:rgba(255,255,255,.035)}
.tbl.fresh{opacity:0;transform:translateY(10px);animation:in .3s ease forwards}
.tbl h4{margin:0 0 5px;font-size:18px;color:var(--gold)}
.tbl .pur{font-size:13.5px;color:var(--ink-dim);margin-bottom:10px;min-height:38px;line-height:1.4}
.tbl ul{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:14px;line-height:1.8}
.tbl li{color:var(--ink-dim)}
.tbl li b{color:var(--ink);font-weight:500}
.tbl li .ck{color:var(--red)}
.seed{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.seed.fresh{opacity:0;animation:in .3s ease forwards}
.schema>.state{grid-column:1/-1}

/* ---------- matrix slide ---------- */
.matrix{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:0}
table.iso{width:100%;border-collapse:collapse;font-size:17px}
table.iso th,table.iso td{border:1px solid var(--line-soft);padding:9px 12px;text-align:left}
table.iso th{background:rgba(245,185,66,.09);color:var(--gold-soft);font-weight:600;font-size:14px;
  text-transform:uppercase;letter-spacing:.5px}
table.iso td:first-child{font-family:var(--mono);font-weight:700;color:var(--ink);font-size:15.5px}
table.iso tr{opacity:.22;transition:opacity .3s}
table.iso tr.on{opacity:1}
.yes{color:var(--red);font-weight:600}
.no{color:var(--green);font-weight:600}
.pg-note{color:var(--blue);font-size:13.5px;display:block;margin-top:2px}

/* ---------- bullets ---------- */
.bullets{flex:1;display:grid;grid-template-columns:1fr 1fr;align-content:center;gap:12px;
  max-width:1340px;margin:0 auto;width:100%}
.bullets>.insight{grid-column:1/-1}
.bullet{display:flex;gap:13px;align-items:flex-start;padding:13px 16px;border-radius:14px;
  border:1px solid var(--line-soft);background:rgba(255,255,255,.03);
  }
.bullet.fresh{opacity:0;transform:translateX(-10px);animation:inx .3s ease forwards}
@keyframes inx{to{opacity:1;transform:none}}
.bullet .n{font-family:var(--mono);font-size:15px;color:var(--gold);flex:0 0 auto;
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center}
.bullet h5{margin:0 0 3px;font-size:19px;font-weight:600}
.bullet p{margin:0;font-size:16px;color:var(--ink-dim);line-height:1.45}
.bullet code{font-family:var(--mono);font-size:15px;color:var(--gold-soft);
  background:rgba(245,185,66,.1);padding:1px 6px;border-radius:5px}

/* ---------- footer ---------- */
footer{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:10px 26px;
  border-top:1px solid var(--line-soft)}
.dots{display:flex;gap:6px;flex:1 1 auto;flex-wrap:wrap}
.pd{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16);cursor:pointer;
  transition:background .2s,transform .2s}
.pd:hover{transform:scale(1.35)}
.pd.done{background:rgba(245,185,66,.45)}
.pd.now{background:var(--gold);transform:scale(1.35)}
.steps{font-family:var(--mono);font-size:13.5px;color:var(--ink-dim);white-space:nowrap}
.keys{font-size:13px;color:var(--ink-dim);white-space:nowrap}

/* ---------- notes drawer ---------- */
#notes{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(101%);
  transition:transform .28s ease;background:rgba(6,14,12,.97);border-top:2px solid var(--gold);
  padding:16px 26px 18px;max-height:46vh;overflow-y:auto;backdrop-filter:blur(8px)}
#notes.open{transform:none}
#notes h6{margin:0 0 8px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold)}
#notes .say{font-size:19px;line-height:1.6;max-width:1100px}
#notes .say b{color:var(--gold-soft)}
#notes .nxt{margin-top:10px;font-size:14.5px;color:var(--ink-dim);font-family:var(--mono)}

/* ---------- overview ---------- */
#ov{position:fixed;inset:0;z-index:50;background:rgba(4,10,9,.97);padding:34px;
  display:none;overflow-y:auto;backdrop-filter:blur(6px)}
#ov.open{display:block}
#ov h3{margin:0 0 18px;font-size:18px;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}
.ovc{padding:14px;border-radius:12px;border:1px solid var(--line-soft);cursor:pointer;
  background:rgba(255,255,255,.03);transition:border-color .2s,transform .2s}
.ovc:hover{border-color:var(--gold);transform:translateY(-2px)}
.ovc .i{font-family:var(--mono);font-size:12.5px;color:var(--gold)}
.ovc .t{font-size:16.5px;font-weight:600;margin-top:4px}
.ovc .s{font-size:13.5px;color:var(--ink-dim);margin-top:3px;line-height:1.45}

@media (max-width:900px){
  .panes{grid-template-columns:1fr}
  .schema{grid-template-columns:repeat(2,1fr)}
  .bullets{grid-template-columns:1fr}
  header{padding:12px 16px}
  main{padding:14px 16px}
  footer{padding:9px 16px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Transaction<small>Cafe</small></div>
    <div class="title-wrap">
      <div class="slide-title" id="sTitle">—</div>
      <div class="slide-sub" id="sSub">—</div>
    </div>
    <div class="badges">
      <span class="badge" id="sTag">intro</span>
      <span class="badge pg">PostgreSQL 15.15</span>
      <span class="clock" id="clock">00:00</span>
    </div>
  </header>
  <main id="stage"></main>
  <footer>
    <div class="dots" id="dots"></div>
    <div class="steps" id="stepCount">—</div>
    <div class="keys"><kbd>→</kbd> step &nbsp;<kbd>S</kbd> notes &nbsp;<kbd>O</kbd> map &nbsp;<kbd>F</kbd> full</div>
  </footer>
</div>

<div id="notes">
  <h6>Speaker notes</h6>
  <div class="say" id="noteSay">—</div>
  <div class="nxt" id="noteNxt"></div>
</div>

<div id="ov">
  <h3>Run of show</h3>
  <div class="ovgrid" id="ovGrid"></div>
</div>
<script>
/* =====================================================================
   Transaction Cafe — presenter deck
   Every SQL line and every result below was captured from a real run
   against PostgreSQL 15.15 (database: transaction_cafe).
   ===================================================================== */
const T1 = {name:'Session 1 · T1', role:'psql — terminal one'};
const T2 = {name:'Session 2 · T2', role:'psql — terminal two'};

const DECK = [

/* 0 ------------------------------------------------------------------ */
{
 id:'title', type:'title', tag:'intro',
 title:'Transactions in PostgreSQL — a live practical',
 sub:'Twelve runnable demos, two terminals, one cafe',
 steps:[{note:'Open with the story: every order at a cafe is a transaction. Money leaves a wallet, a cup leaves the counter, a line goes into the ledger. Either <b>all</b> of it happens or <b>none</b> of it does. Today we prove that on a real database — not on slides.'}]
},

/* 1 ------------------------------------------------------------------ */
{
 id:'schema', type:'schema', tag:'setup',
 title:'The cafe, as four tables',
 sub:'sql/00_setup.sql — schema, constraints and seed data',
 steps:[
  {note:'Walk the four tables. Point out that <b>customers</b> and <b>menu</b> carry CHECK constraints — those constraints are what will later force a rollback. This is Consistency: the database refuses to enter an invalid state.'},
  {note:'The two CHECK constraints are the heroes of demo 2. A wallet can never go below zero, a stock count can never go below zero.'},
  {note:'Seed values: both customers start at ₹5000. Cold Brew has only <b>3</b> cups — deliberately scarce. Three old orders are already above ₹1000, which is what the phantom-read demo will count.'}
 ]
},

/* 2 ------------------------------------------------------------------ */
{
 id:'commit', type:'dual', solo:true, tag:'A — atomicity',
 title:'Demo 1 · One order = four writes that must land together',
 sub:'sql/01_atomicity_commit.sql — the happy path',
 t1:{...T1, role:'Diya orders a Cappuccino (₹180)', iso:'READ COMMITTED'},
 chips:[
  {id:'w', k:'Diya wallet (committed)', v:'₹5000.00'},
  {id:'s', k:'Cappuccino stock', v:'10'},
  {id:'o', k:'Orders table', v:'3 rows'},
  {id:'l', k:'Ledger', v:'0 rows'}
 ],
 steps:[
  {who:'t1', t:'t=0', sql:'BEGIN;', out:'BEGIN', cls:'muted',
   insight:'A transaction opens. From here on, nothing is real to anyone else until COMMIT.',
   note:'BEGIN opens the unit of work. Stress that PostgreSQL is in autocommit by default — without BEGIN, every statement is its own transaction.'},
  {who:'t1', t:'1 · debit', sql:"UPDATE customers SET wallet_balance = wallet_balance - 180\n WHERE name = 'Diya';", out:'UPDATE 1',
   chips:{w:{v:'₹4820.00', n:'uncommitted', cls:'dirty'}}, flash:['w'],
   insight:'The money is gone — <b>but only inside this transaction</b>. Any other session still sees ₹5000.00.',
   note:'This is the moment to say: the row is now modified, but it is a private version. Postgres keeps the old version around for everyone else. That is MVCC.'},
  {who:'t1', t:'2 · order', sql:'INSERT INTO orders (cust_id, item_id, qty, amount)\n SELECT c.cust_id, m.item_id, 1, m.price\n FROM customers c, menu m\n WHERE c.name = \'Diya\' AND m.item_name = \'Cappuccino\';', out:'INSERT 0 1',
   chips:{o:{v:'4 rows', n:'uncommitted', cls:'dirty'}}, flash:['o'],
   note:'Second write. Ask the class: if the power goes out right now, what should the wallet look like when the server restarts? Answer: ₹5000 — nothing was committed.'},
  {who:'t1', t:'3 · stock', sql:"UPDATE menu SET stock_qty = stock_qty - 1\n WHERE item_name = 'Cappuccino';", out:'UPDATE 1',
   chips:{s:{v:'9', n:'uncommitted', cls:'dirty'}}, flash:['s'],
   note:'Third write — the cup leaves the counter.'},
  {who:'t1', t:'4 · ledger', sql:"INSERT INTO cafe_ledger (order_id, description, amount)\n VALUES (currval('orders_order_id_seq'), 'Cappuccino x1 - Diya', 180);", out:'INSERT 0 1',
   chips:{l:{v:'1 row', n:'uncommitted', cls:'dirty'}}, flash:['l'],
   note:'Fourth write. Four separate statements — and the business rule is that all four are one event.'},
  {who:'t1', t:'check', sql:"SELECT name, wallet_balance FROM customers WHERE name = 'Diya';",
   out:' name | wallet_balance \n------+----------------\n Diya |        4820.00', cls:'ok',
   insight:'Inside the transaction T1 sees ₹4820.00. Outside, the world is still at ₹5000.00.',
   note:'Two truths at the same time. This is exactly what Isolation means.'},
  {who:'t1', t:'commit', sql:'COMMIT;', out:'COMMIT', cls:'ok',
   chips:{w:{v:'₹4820.00', n:'durable', cls:'good'}, s:{v:'9', n:'durable', cls:'good'},
          o:{v:'4 rows', n:'durable', cls:'good'}, l:{v:'1 row', n:'durable', cls:'good'}},
   flash:['w','s','o','l'], ins:'win',
   insight:'<b>Atomicity</b> — all four writes became visible in the same instant. <b>Durability</b> — they are on disk before COMMIT returned.',
   note:'Land the point: nobody ever saw three of the four writes. The switch flipped once, for everything, at COMMIT.'}
 ]
},

/* 3 ------------------------------------------------------------------ */
{
 id:'rollback', type:'dual', solo:true, tag:'A — atomicity',
 title:'Demo 2 · The failure path — one broken rule undoes everything',
 sub:'sql/02_atomicity_rollback.sql — Shan orders 5 Cold Brews, only 3 exist',
 t1:{...T1, role:'Shan orders 5 × Cold Brew (₹1250)', iso:'READ COMMITTED'},
 chips:[
  {id:'w', k:'Shan wallet (committed)', v:'₹5000.00'},
  {id:'s', k:'Cold Brew stock', v:'3'},
  {id:'st', k:'Transaction state', v:'idle'}
 ],
 steps:[
  {who:'t1', t:'t=0', sql:'BEGIN;', out:'BEGIN', cls:'muted',
   chips:{st:{v:'open'}}, flash:['st'],
   note:'Set the trap deliberately: we debit the money BEFORE we check the stock. This is the classic ordering bug that transactions save you from.'},
  {who:'t1', t:'1 · debit', sql:"UPDATE customers SET wallet_balance = wallet_balance - 1250\n WHERE name = 'Shan';", out:'UPDATE 1',
   chips:{w:{v:'₹3750.00', n:'uncommitted', cls:'dirty'}}, flash:['w'],
   insight:'₹1250 has left Shan\'s wallet. The cups have not been checked yet.',
   note:'Money gone. Now ask the class what happens if the next statement fails.'},
  {who:'t1', t:'2 · stock', sql:"UPDATE menu SET stock_qty = stock_qty - 5\n WHERE item_name = 'Cold Brew';",
   out:'ERROR:  new row for relation "menu" violates check constraint "stock_never_negative"\nDETAIL:  Failing row contains (1, Cold Brew, 250.00, -2).', cls:'err',
   chips:{st:{v:'aborted', cls:'bad'}}, flash:['st'], ins:'warn',
   insight:'<b>Consistency</b> — the CHECK refuses the write. Stock would have gone to −2, so the database says no.',
   note:'Read the DETAIL line out loud: "Failing row contains ... -2". The constraint caught an impossible world before it existed.'},
  {who:'t1', t:'3 · ledger', sql:"INSERT INTO cafe_ledger (description, amount)\n VALUES ('Cold Brew x5 - Shan', 1250);",
   out:'ERROR:  current transaction is aborted, commands ignored until end of transaction block', cls:'err',
   insight:'Once a statement fails, PostgreSQL <b>blocks every later statement</b> in that transaction. You cannot half-succeed.',
   note:'This is a PostgreSQL-specific behaviour worth naming: other engines let you continue after an error. Postgres locks the whole block until you ROLLBACK or use a SAVEPOINT.'},
  {who:'t1', t:'end', sql:'ROLLBACK;', out:'ROLLBACK', cls:'ok',
   chips:{w:{v:'₹5000.00', n:'restored', cls:'good'}, s:{v:'3', n:'untouched', cls:'good'}, st:{v:'idle'}},

  {who:'t1', t:'after', sql:'SELECT pg_current_wal_lsn();',
   out:' wal_after \n-----------\n 0/35C2B88', cls:'ok',
   chips:{w:{v:'0/35C2B88', n:'+528 bytes, flushed', cls:'good'}}, flash:['w'], ins:'win',
   insight:'The odometer moved by 528 bytes <b>before</b> COMMIT returned. Pull the plug now and recovery replays that log — the order survives.',
   note:'Sequence to say out loud: write to WAL, flush WAL to disk, return COMMIT, update the data files later. The table pages can lag; the log never does. That is why the data page order and the durability order are different things.'}
 ]
},

/* 14 ----------------------------------------------------------------- */
{
 id:'matrix', type:'matrix', tag:'reference',
 title:'Isolation levels — the standard, and what PostgreSQL actually does',
 sub:'Tested on this database, not copied from a textbook',
 steps:[
  {note:'Build this table row by row. The left half is the ANSI standard the slides quoted; the blue lines are what we just measured on this server.'},
  {note:'READ UNCOMMITTED: the standard permits all three anomalies. PostgreSQL silently upgrades it — demo 4 proved it.'},
  {note:'READ COMMITTED: the default. Dirty reads gone; non-repeatable and phantom reads both demonstrated live in demos 5 and 7.'},
  {note:'REPEATABLE READ: the standard still allows phantoms. PostgreSQL prevents them, because snapshot isolation freezes the whole visible set — demos 6 and 8.'},
  {note:'SERIALIZABLE: everything prevented, and it also catches write skew that snapshots miss. Cost: more 40001 errors, so you need a retry loop.'},
  {note:'Leave the closing line on screen: you do not choose an isolation level for elegance, you choose it for the anomaly you cannot afford.'}
 ]
},

/* 15 ----------------------------------------------------------------- */
{
 id:'takeaway', type:'bullets', tag:'takeaway',
 title:'What to carry out of the cafe',
 sub:'Six rules that survive the exam and the job',
 steps:[
  {note:'Rule one — the whole reason transactions exist.'},
  {note:'Rule two — errors are normal; plan the undo path, not just the happy path.'},
  {note:'Rule three — the default is READ COMMITTED and it is not always enough.'},
  {note:'Rule four — snapshot isolation is not the same as locking. Readers never block writers in Postgres.'},
  {note:'Rule five — 40001 and 40P01 are application-level responsibilities, not database bugs.'},
  {note:'Rule six — keep transactions short. Every guarantee above gets cheaper when the transaction ends quickly.'},
  {note:'Close with the line from the deck: every real-world payment, booking or order is a transaction at work. Then point them at the sql/ folder to run all twelve themselves.'}
 ]
}
];
</script>
<script>
/* ===================== engine ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
let si = 0, pi = 0;                 // slide index, step index
let lastSlide = null;               // so entrance animations play once, not on every step

const KW = /\b(BEGIN|COMMIT|ROLLBACK|SAVEPOINT|SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|SET|VALUES|INTO|AND|OR|ORDER BY|GROUP BY|TRANSACTION|ISOLATION|LEVEL|READ|WRITE|UNCOMMITTED|COMMITTED|REPEATABLE|SERIALIZABLE|FOR UPDATE|SHOW|TO|count)\b/g;
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl  = s => esc(s).replace(KW, m => '<span class="kw">'+m+'</span>');

/* ---------- static bodies ---------- */
function titleBody(){
  return `<div class="hero">
    <div class="cup">&#9749;</div>
    <h1>Transactions in <em>PostgreSQL</em></h1>
    <p>Twelve demos run live against a real PostgreSQL 15.15 server. Every result on the
       following slides was captured from an actual session — nothing here is illustrative.</p>
    <div class="hero-chips">
      <span>&#9679; Atomicity &amp; Rollback</span><span>&#9679; Savepoints</span>
      <span>&#9679; Dirty / Non-repeatable / Phantom reads</span><span>&#9679; Isolation levels</span>
      <span>&#9679; Lost updates &amp; 40001</span><span>&#9679; Deadlocks &amp; 40P01</span>
      <span>&#9679; WAL durability</span>
    </div>
    <div class="kbd-hint"><kbd>&rarr;</kbd> or <kbd>Space</kbd> to step &nbsp;·&nbsp;
      <kbd>&darr;</kbd> next slide &nbsp;·&nbsp; <kbd>S</kbd> speaker notes &nbsp;·&nbsp;
      <kbd>O</kbd> run of show &nbsp;·&nbsp; <kbd>F</kbd> full screen</div>
  </div>`;
}

const TABLES = [
 {n:'customers', p:'Who is ordering, and how much money they are carrying.',
  c:['<b>cust_id</b> SERIAL PK','<b>name</b> TEXT','<b>wallet_balance</b> NUMERIC(10,2)','<span class="ck">CHECK (wallet_balance &gt;= 0)</span>']},
 {n:'menu', p:'What is on the counter and how many are left.',
  c:['<b>item_id</b> SERIAL PK','<b>item_name</b> TEXT','<b>price</b> NUMERIC(10,2)','<b>stock_qty</b> INT','<span class="ck">CHECK (stock_qty &gt;= 0)</span>']},
 {n:'orders', p:'One row per order placed at the counter.',
  c:['<b>order_id</b> SERIAL PK','<b>cust_id</b> &rarr; customers','<b>item_id</b> &rarr; menu','<b>qty</b> INT','<b>amount</b> NUMERIC(10,2)','<b>status</b> TEXT']},
 {n:'cafe_ledger', p:'The permanent money record — what must survive a crash.',
  c:['<b>entry_id</b> SERIAL PK','<b>order_id</b> &rarr; orders','<b>description</b> TEXT','<b>amount</b> NUMERIC(10,2)','<b>entry_time</b> TIMESTAMP']}
];

function schemaBody(step, entering){
  let h = '<div class="schema">';
  TABLES.forEach((t,i)=>{
    h += `<div class="tbl${entering?' fresh':''}" style="animation-delay:${i*70}ms">
      <h4>${t.n}</h4><div class="pur">${t.p}</div>
      <ul>${t.c.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  });
  if(step >= 1){
    h += `<div class="seed${step === 1 ? ' fresh':''}" style="animation-delay:120ms">
      <div class="insight" style="flex:1"><div class="ic">&#128737;</div><div class="tx">
      The two <b>CHECK</b> constraints are not decoration. <code>stock_qty &gt;= 0</code> is what
      fails in demo 2 and forces a whole transaction to be undone — that is <b>Consistency</b>
      protecting <b>Atomicity</b>.</div></div></div>`;
  }
  if(step >= 2){
    h += `<div class="state" style="margin-top:2px">
      <div class="chip"><div class="k">Shan wallet</div><div class="v">&#8377;5000.00</div></div>
      <div class="chip"><div class="k">Diya wallet</div><div class="v">&#8377;5000.00</div></div>
      <div class="chip"><div class="k">Cold Brew stock</div><div class="v">3</div><div class="n">deliberately scarce</div></div>
      <div class="chip"><div class="k">Cappuccino stock</div><div class="v">10</div></div>
      <div class="chip"><div class="k">Orders &gt; &#8377;1000</div><div class="v">3</div><div class="n">for the phantom demo</div></div>
    </div>`;
  }
  return h;
}

const Y = '<span class="yes">Yes</span>';
const N = '<span class="no">No</span>';
const PGN = Y + '<span class="pg-note">PostgreSQL: No</span>';

const ISO_ROWS = [
 ['READ UNCOMMITTED', PGN, Y, Y,
  'PostgreSQL silently runs this as READ COMMITTED. Demo 4 asked for it and still read &#8377;5000.00, never the uncommitted &#8377;3000.00.'],
 ['READ COMMITTED', N, Y, Y,
  'The default. A fresh snapshot per statement: demo 5 saw 5000 &rarr; 3000, demo 7 saw 3 &rarr; 4 rows.'],
 ['REPEATABLE READ', N, N, PGN,
  'Snapshot isolation freezes the whole visible set, so phantoms go too &mdash; demo 8 counted 3 twice. Write conflicts now raise 40001 (demo 9).'],
 ['SERIALIZABLE', N, N, N,
  'Adds predicate locking to catch write skew that snapshots miss. Expect more 40001 &mdash; always retry.']
];

function matrixBody(step){
  let h = `<div class="matrix"><table class="iso"><thead><tr>
    <th>Isolation level</th><th>Dirty read<br><small style="opacity:.7;font-weight:400">ANSI</small></th><th>Non-repeatable read<br><small style="opacity:.7;font-weight:400">ANSI</small></th><th>Phantom read<br><small style="opacity:.7;font-weight:400">ANSI</small></th><th>What this database actually did</th></tr></thead><tbody>`;
  ISO_ROWS.forEach((r,i)=>{
    const on = step >= i+1 ? 'on' : '';
    h += `<tr class="${on}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td>
      <td style="font-size:15px;color:var(--ink-dim);line-height:1.5">${r[4]}</td></tr>`;
  });
  h += '</tbody></table>';
  if(step >= 5){
    h += `<div class="insight"><div class="ic">&#127919;</div><div class="tx">
      <b>Yes / No</b> columns are the ANSI standard — what a level is <i>allowed</i> to permit.
      An engine may prevent more than the standard requires, and PostgreSQL does.
      Pick a level for the anomaly you cannot afford, then pay for it in retries or in waiting.</div></div>`;
  }
  h += '</div>';
  return h;
}

const RULES = [
 ['All or nothing is the whole point','A transaction turns many statements into one event. Demo 2: the debit succeeded, the stock write failed, and the debit was erased with it.'],
 ['Design the undo path','Wrap every multi-step write in <code>BEGIN … COMMIT</code>, use <code>SAVEPOINT</code> for optional steps, and never leave a transaction open waiting on a human.'],
 ['Know your default','PostgreSQL gives you <code>READ COMMITTED</code>: a fresh snapshot per statement. Two reads of the same row in one transaction can legitimately differ.'],
 ['Snapshots, not locks','<code>REPEATABLE READ</code> freezes what you can see at the first statement. Readers never block writers and writers never block readers.'],
 ['Catch 40001 and 40P01','<code>could not serialize access</code> and <code>deadlock detected</code> are normal under load. Retry the transaction; do not weaken the isolation level to hide them.'],
 ['Lock in a fixed order, and be brief','Order your row locks consistently to make deadlocks impossible, and keep transactions short so locks and snapshots are released fast.']
];

function bulletsBody(step){
  let h = '<div class="bullets">';
  RULES.forEach((r,i)=>{
    if(step >= i)
      h += `<div class="bullet${i === step ? ' fresh':''}">
        <div class="n">${i+1}</div><div><h5>${r[0]}</h5><p>${r[1]}</p></div></div>`;
  });
  if(step >= 6)
    h += `<div class="insight win"><div class="ic">&#9749;</div><div class="tx">
      <b>&ldquo;Every real-world payment, booking, or order &mdash; is a transaction at work.&rdquo;</b>
      &nbsp; Run all twelve yourself: <code>psql -d transaction_cafe -f sql/00_setup.sql</code>, then
      <code>./run_demo.sh 05_non_repeatable_read</code>.</div></div>`;
  h += '</div>';
  return h;
}

/* ---------- session-pane slides ---------- */
function paneHTML(meta, who, slide, step){
  // keep the original step index so only the line that just ran animates
  const steps = slide.steps.slice(0, step+1)
                  .map((s,idx)=>({...s, idx}))
                  .filter(s => s.who === who);
  const liveNow = slide.steps[step] && slide.steps[step].who === who;
  let body = '';
  steps.forEach((s,i)=>{
    const last  = i === steps.length-1;
    const fresh = s.idx === step;
    body += `<div class="line${fresh?' fresh':''}">
      <div><span class="tm">${s.t||''}</span><span class="sql">${hl(s.sql)}</span></div>
      ${s.out ? `<div class="out ${s.cls||''}">${esc(s.out)}</div>` : ''}
    </div>`;
    if(last && liveNow) body += '<div class="cursor"></div>';
  });
  if(!body) body = '<div class="out muted">idle — waiting to start</div>';
  return `<div class="pane${liveNow?' live':''}">
    <div class="pane-head"><span class="dot"></span>
      <span class="pane-name">${meta.name}</span>
      <span class="pane-role">${meta.role}</span>
      ${meta.iso ? `<span class="pane-iso">${meta.iso}</span>`:''}
    </div>
    <div class="pane-body">${body}</div></div>`;
}

function chipsHTML(slide, step){
  const cur = {};
  (slide.chips||[]).forEach(c => cur[c.id] = {...c});
  for(let i=0;i<=step;i++){
    const p = slide.steps[i].chips || {};
    for(const k in p) cur[k] = {...cur[k], ...p[k]};
  }
  const flash = (slide.steps[step] && slide.steps[step].flash) || [];
  return '<div class="state">' + (slide.chips||[]).map(c=>{
    const s = cur[c.id];
    return `<div class="chip ${s.cls||''}${flash.includes(c.id)?' flash':''}">
      <div class="k">${s.k}</div><div class="v">${s.v}</div>
      ${s.n?`<div class="n">${s.n}</div>`:''}</div>`;
  }).join('') + '</div>';
}

function dualBody(slide, step){
  const s = slide.steps[step] || {};
  let h = `<div class="panes${slide.solo?' solo':''}">`;
  h += paneHTML(slide.t1,'t1',slide,step);
  if(!slide.solo) h += paneHTML(slide.t2,'t2',slide,step);
  h += '</div>';
  h += chipsHTML(slide, step);
  const ins = (()=>{ for(let i=step;i>=0;i--) if(slide.steps[i].insight)
                      return {tx:slide.steps[i].insight, k:slide.steps[i].ins||''}; return null; })();
  h += `<div class="insight ${ins?ins.k:''}" style="${ins?'':'opacity:.35'}">
      <div class="ic">${ins && ins.k==='warn' ? '&#9888;&#65039;' : ins && ins.k==='win' ? '&#9989;' : '&#128161;'}</div>
      <div class="tx">${ins ? ins.tx : 'Press &rarr; to run the first statement.'}</div></div>`;
  return h;
}

/* ---------- render ---------- */
function bodyFor(slide, step, entering){
  switch(slide.type){
    case 'title':  return titleBody();
    case 'schema': return schemaBody(step, entering);
    case 'matrix': return matrixBody(step);
    case 'bullets':return bulletsBody(step);
    default:       return dualBody(slide, step);
  }
}

function render(){
  const slide = DECK[si];
  pi = Math.max(0, Math.min(pi, slide.steps.length-1));
  const entering = lastSlide !== slide.id;
  lastSlide = slide.id;
  stage.innerHTML = `<div class="slide active">${bodyFor(slide, pi, entering)}</div>`;
  $('#sTitle').textContent = slide.title;
  $('#sSub').textContent   = slide.sub;
  $('#sTag').textContent   = slide.tag;
  $('#stepCount').textContent = `slide ${si+1}/${DECK.length} · step ${pi+1}/${slide.steps.length}`;
  $('#noteSay').innerHTML  = slide.steps[pi].note || '—';
  const nxt = pi+1 < slide.steps.length
      ? `next → step ${pi+2} of this slide`
      : (si+1 < DECK.length ? `next → ${DECK[si+1].title}` : 'end of deck');
  $('#noteNxt').textContent = nxt;
  // auto-scroll panes to the bottom
  document.querySelectorAll('.pane-body').forEach(p => p.scrollTop = p.scrollHeight);
  renderDots();
}

function renderDots(){
  const d = $('#dots');
  d.innerHTML = DECK.map((s,i)=>
    `<span class="pd ${i<si?'done':''}${i===si?' now':''}" data-i="${i}" title="${s.title}"></span>`).join('');
  d.querySelectorAll('.pd').forEach(el =>
    el.onclick = () => { si = +el.dataset.i; pi = 0; render(); });
}

/* ---------- navigation ---------- */
function next(){
  const s = DECK[si];
  if(pi < s.steps.length-1) pi++;
  else if(si < DECK.length-1){ si++; pi = 0; }
  else return;
  render();
}
function prev(){
  if(pi > 0) pi--;
  else if(si > 0){ si--; pi = DECK[si].steps.length-1; }
  else return;
  render();
}
function slideJump(d){
  const n = si + d;
  if(n < 0 || n >= DECK.length) return;
  si = n; pi = 0; render();
}

document.addEventListener('keydown', e=>{
  if($('#ov').classList.contains('open') && e.key !== 'o' && e.key !== 'O' && e.key !== 'Escape') return;
  switch(e.key){
    case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
    case 'ArrowLeft':  case 'PageUp': e.preventDefault(); prev(); break;
    case 'ArrowDown':  e.preventDefault(); slideJump(1); break;
    case 'ArrowUp':    e.preventDefault(); slideJump(-1); break;
    case 'Home':       si=0; pi=0; render(); break;
    case 'End':        si=DECK.length-1; pi=DECK[si].steps.length-1; render(); break;
    case 'f': case 'F':
      if(document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen(); break;
    case 's': case 'S': $('#notes').classList.toggle('open'); break;
    case 'o': case 'O': $('#ov').classList.toggle('open'); break;
    case 'Escape': $('#ov').classList.remove('open'); $('#notes').classList.remove('open'); break;
    case 'r': case 'R': pi = 0; render(); break;
  }
});
stage.addEventListener('click', e => { if(!e.target.closest('.pane-body')) next(); });

/* ---------- overview ---------- */
$('#ovGrid').innerHTML = DECK.map((s,i)=>
  `<div class="ovc" data-i="${i}"><div class="i">${String(i+1).padStart(2,'0')} · ${s.tag}</div>
   <div class="t">${s.title}</div><div class="s">${s.sub||''}</div></div>`).join('');
$('#ovGrid').querySelectorAll('.ovc').forEach(el =>
  el.onclick = () => { si = +el.dataset.i; pi = 0; $('#ov').classList.remove('open'); render(); });

/* ---------- timer ---------- */
const t0 = Date.now();
setInterval(()=>{
  const s = Math.floor((Date.now()-t0)/1000);
  $('#clock').textContent =
    String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}, 1000);

render();
</script>
</body>
</html>
